# Social-card copy for index.html's og: tags, English unless ?lang=de.
map $arg_lang $og_lang  { default en; de de; }
map $arg_lang $og_query { default ""; de "?lang=de"; }
map $arg_lang $og_desc  {
    default "Explore OceanCare's projects around the world on an interactive map.";
    de      "Entdecken Sie die Projekte von OceanCare weltweit auf einer interaktiven Karte.";
}
map $arg_lang $og_alt   {
    default "OceanCare Compass: a map of OceanCare's projects worldwide";
    de      "OceanCare Compass: eine Karte der Projekte von OceanCare weltweit";
}
# Behind a TLS-terminating proxy $scheme is http; trust its header when set.
map $http_x_forwarded_proto $og_scheme { default $http_x_forwarded_proto; "" $scheme; }

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip_static on;
    gzip on;
    gzip_types application/javascript application/json;
    gzip_min_length 1024;
    # Also compress for requests that came through a proxy (Via header).
    gzip_proxied any;
    gzip_vary on;

    location / {
        try_files $uri $uri/ /index.html;
        # og:image and og:url must be absolute, and the origin is known only per
        # request. $http_host keeps a non-default port.
        sub_filter_once off;
        sub_filter __OG_ORIGIN__ $og_scheme://$http_host;
        sub_filter __OG_QUERY__  $og_query;
        sub_filter __OG_LANG__   $og_lang;
        sub_filter __OG_DESC__   $og_desc;
        sub_filter __OG_ALT__    $og_alt;
    }

    # Embedded under this unversioned URL: revalidate on every load (304 via ETag).
    location = /compass-map.js {
        add_header Cache-Control "no-cache";
    }

    # Social cards.
    location /og/ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Atlas topology. An embedded widget fetches it cross-origin, hence CORS.
    # gzip_static serves the .gz made in the image build. Immutable because the
    # bundle requests it with a content hash (?v=).
    location /basemap/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
        try_files $uri =404;
    }

    # Baked GEBCO rasters. Immutable because the bundle requests them with a
    # content hash (?v=).
    location /bathy/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # The globe reads the raster back from a canvas, which a cross-origin
        # image without this header would taint.
        add_header Access-Control-Allow-Origin "*";
        access_log off;
        # Missing rasters are valid: the map then draws a flat sea.
        try_files $uri =404;
    }

    # Same-origin API for the widget served from this host, so no CORS.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
