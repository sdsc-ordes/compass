server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip_static on;
    gzip on;
    gzip_types application/javascript;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Pre-rendered GEBCO bathymetry, served from our own origin so the visitor's
    # browser never contacts a tile service. Content is immutable: a rebuild
    # writes the same z/x/y, so a long max-age is safe.
    location /tiles/ {
        alias /data/tiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        # No tiles mounted is a valid deployment: the map falls back to its
        # vector basemap, so an absent tile is not an error worth logging.
        try_files $uri =404;
    }

    # Serving the API from this origin keeps the widget same-origin, so no CORS.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
