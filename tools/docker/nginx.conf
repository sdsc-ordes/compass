# Social-card copy for index.html's og: tags, English unless ?lang=de.
map $arg_lang $og_lang  { default en; de de; }
map $arg_lang $og_query { default ""; de "?lang=de"; }
map $arg_lang $og_desc  {
    default "Explore OceanCare's projects around the world on an interactive map.";
    de      "Entdecken Sie die Projekte von OceanCare weltweit auf einer interaktiven Karte.";
}
map $arg_lang $og_alt   {
    default "OceanCare Compass: a map of OceanCare's projects worldwide";
    de      "OceanCare Compass: eine Karte der Projekte von OceanCare weltweit";
}
# Behind a TLS-terminating proxy $scheme is http; trust its header when set.
map $http_x_forwarded_proto $og_scheme { default $http_x_forwarded_proto; "" $scheme; }

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip_static on;
    gzip on;
    gzip_types application/javascript;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
        # og:image and og:url must be absolute, and the origin is known only per
        # request. $http_host keeps a non-default port.
        sub_filter_once off;
        sub_filter __OG_ORIGIN__ $og_scheme://$http_host;
        sub_filter __OG_QUERY__  $og_query;
        sub_filter __OG_LANG__   $og_lang;
        sub_filter __OG_DESC__   $og_desc;
        sub_filter __OG_ALT__    $og_alt;
    }

    # Social cards. The @2x files ship alongside but are not referenced.
    location /og/ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Pre-rendered GEBCO bathymetry, served from our own origin so the visitor's
    # browser never contacts a tile service. Small enough (~25 MB, most of it the
    # d/ detail tiles, of which a visitor fetches at most a handful) to ship
    # inside the image, and immutable: a rebake writes the same names.
    location /bathy/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # The globe reads its raster back off a canvas to reproject it, which a
        # cross-origin image would taint. Embedded on oceancare.org it is exactly
        # that, so the file has to say it may be read. It carries no visitor data
        # and is the same bytes for everyone.
        add_header Access-Control-Allow-Origin "*";
        access_log off;
        # No rasters baked is a valid deployment: the map falls back to its
        # vector basemap, so an absent file is not an error worth logging.
        try_files $uri =404;
    }

    # Serving the API from this origin keeps the widget same-origin, so no CORS.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
