<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OceanCare Compass</title>
  <!-- Social card. Crawlers run no JS, so nginx fills the __OG_*__ placeholders
       (origin; German text and image on ?lang=de). See nginx.conf. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="OceanCare Compass">
  <meta property="og:description" content="__OG_DESC__">
  <meta property="og:url" content="__OG_ORIGIN__/__OG_QUERY__">
  <meta property="og:image" content="__OG_ORIGIN__/og/compass-og-__OG_LANG__.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="__OG_ALT__">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    html, body { margin: 0; height: 100%; background: #f1f5f9; }
    compass-map { display: block; height: 100vh; }
  </style>
  <!-- Matomo Tag Manager -->
  <script>
    var _mtm = (window._mtm = window._mtm || []);
    _mtm.push({ 'mtm.startTime': new Date().getTime(), event: 'mtm.Start' });
    (function () {
      var d = document,
        g = d.createElement('script'),
        s = d.getElementsByTagName('script')[0];
      g.async = true;
      g.src = 'https://stats.oceancare.org/js/container_6zoKVnve.js';
      s.parentNode.insertBefore(g, s);
    })();
  </script>
  <!-- End Matomo Tag Manager -->
</head>
<body>
  <!-- Matomo Image Tracker-->
  <noscript
    ><img
      referrerpolicy="no-referrer-when-downgrade"
      src="https://stats.oceancare.org/matomo.php?idsite=5&amp;rec=1"
      style="border: 0"
      alt=""
  /></noscript>
  <!-- End Matomo -->
  <compass-map lang="en"></compass-map>

  <script src="/compass-map.js"></script>
  <script>
    // nginx serves /api/, /basemap/ and /bathy/ on this origin.
    document.querySelector('compass-map').setAttribute('apiurl', location.origin);
    document.querySelector('compass-map').setAttribute('tileurl', location.origin);
  </script>
</body>
</html>
