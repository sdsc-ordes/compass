[project]
name = "compass-tools"
version = "0.1.0"
description = "Ontology generation from the source-data workbook"
requires-python = ">=3.11"
dependencies = [
    "odfpy>=1.4",
    "pyshacl>=0.31.0",
    "rdflib>=7.6.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
