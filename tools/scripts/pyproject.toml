[project]
name = "compass-tools"
version = "0.1.0"
description = "Ontology generation from the taxonomy sheet"
requires-python = ">=3.11"
dependencies = [
    "pyshacl>=0.31.0",
    "rdflib>=7.6.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "openpyxl>=3.1",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
