# Shared by src/backend and src/turtle-generator; the just recipes pass it with --config.

line-length = 92
target-version = "py311"

[lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "PL",   # pylint
]
ignore = [
    # Widget inference and clause building are flat lists of parallel cases.
    "PLR0912",
    # The query builders take each filter category as its own argument.
    "PLR0913",
]

[lint.per-file-ignores]
# Assertions compare against literal values.
"**/tests/*" = ["PLR2004"]
# FastAPI declares dependencies as call-valued defaults (Depends, Query, Header).
"src/backend/app/routers/*" = ["B008"]

[lint.isort]
known-first-party = ["app"]

[format]
quote-style = "double"
