services:
  backend:
    build:
      context: .
      dockerfile: tools/docker/backend.Dockerfile
    # Use-case settings (API_*, STORIES_*); `environment` below takes precedence.
    env_file:
      - path: .env
        required: false
    environment:
      # Shared ontology root (shapes); use-case Turtle lives under COMPASS_USE_CASE.
      COMPASS_ONTOLOGY_DIR: /data/ontology
      COMPASS_USE_CASE: ${COMPASS_USE_CASE:-oceancare}
      # /api/v1/admin/reload is reachable through nginx; unset disables it.
      COMPASS_RELOAD_TOKEN: ${COMPASS_RELOAD_TOKEN:-}
      # Sites embedding the widget from another origin; nginx's own page needs none.
      COMPASS_CORS_ORIGINS: ${COMPASS_CORS_ORIGINS:-}
    volumes:
      # Read-only. Changes on the host are served after a reload request.
      - ./src/ontology:/data/ontology:ro
    healthcheck:
      # The ontology is parsed at startup, so the API is not ready immediately.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: tools/docker/frontend.Dockerfile
    # nginx listens on 80. The backend (8000) is not published; it is reachable
    # only on the Compose network.
    ports:
      - "${COMPASS_HTTP_PORT:-8780}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
