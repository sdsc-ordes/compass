[project]
name = "compass-backend"
version = "1.1.0"
description = "Compass API: SHACL-driven filters and SPARQL over the ontology"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135.3,<1",
    "geojson>=3.2.0,<4",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.0,<3",
    "pyoxigraph>=0.4,<1",
    "rdflib>=7.6.0,<8",
    "uvicorn>=0.42.0,<1",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100,<7",
    "pyshacl>=0.31.0,<1",
    "pytest>=8.0,<10",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
