[project]
name = "compass-docs"
version = "0.0.0"
description = "MkDocs site for Compass"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
docs = [
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.29",
    # Runtime imports for mkdocstrings (src/backend + src/turtle-generator).
    "fastapi>=0.135.3",
    "geojson>=3.2.0",
    "httpx>=0.27",
    "odfpy>=1.4",
    "pydantic-settings>=2.0",
    "pyoxigraph>=0.3.0",
    "pyshacl>=0.31.0",
    "rdflib>=7.6.0",
    "uvicorn>=0.42.0",
]
