site_name: Compass
site_description: Interactive map of ocean-focused organisations, driven by a SHACL-validated RDF ontology
site_url: https://sdsc-ordes.github.io/compass/
repo_url: https://github.com/sdsc-ordes/compass
repo_name: sdsc-ordes/compass
docs_dir: docs
site_dir: site
dev_addr: 127.0.0.1:8888

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
    - search.suggest

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.blocks.caption
  - pymdownx.snippets:
      check_paths: true
      base_path:
        - .
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - src/backend
            - src/turtle-generator
          options:
            docstring_style: google
            members_order: source
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            merge_init_into_class: true
            filters:
              - "!^__"

nav:
  - Overview: index.md
  - Configuration:
      - Ontology: configuration-ontology.md
      - Backend: configuration-backend.md
      - Frontend: configuration-frontend.md
  - Backend:
      - Overview: backend/index.md
      - Design: backend/design.md
      - main: backend/main.md
      - config: backend/config.md
      - core: backend/core.md
      - namespaces: backend/namespaces.md
      - rdf: backend/rdf.md
      - routers: backend/routers.md
      - schemas: backend/schemas.md
      - shacl_to_entities: backend/shacl_to_entities.md
      - shacl_to_filters: backend/shacl_to_filters.md
      - sparql_builder: backend/sparql_builder.md
      - sparql_terms: backend/sparql_terms.md
      - sparql_to_geojson: backend/sparql_to_geojson.md
  - Turtle generator:
      - Overview: turtle-generator/index.md
      - ods_to_rdf: turtle-generator/ods_to_rdf.md
  - Development guide: development-guide.md
  - Code of conduct: code-of-conduct.md
