<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OceanCare Compass</title>
    <style>
        body {
            margin: 0;
            padding: 40px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f1f5f9;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #0f172a; margin-bottom: 24px; }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        compass-map { display: block; height: 700px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>OceanCare Compass</h1>
        <div class="card">
            <compass-map lang="en"></compass-map>
        </div>
    </div>

    <script src="./compass-map.js"></script>
</body>
</html>
